{% if page.scholar %}
<meta name="citation_title" content="{{ page.title | strip_html | escape }}">
{% for author in page.scholar.authors %}
<meta name="citation_author" content="{{ author | escape }}">
{% endfor %}
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
<meta name="citation_journal_title" content="{{ page.venue | escape }}">
<meta name="citation_volume" content="{{ page.scholar.volume | escape }}">
<meta name="citation_issue" content="{{ page.scholar.issue | escape }}">
<meta name="citation_firstpage" content="{{ page.scholar.firstpage | escape }}">
<meta name="citation_lastpage" content="{{ page.scholar.lastpage | escape }}">
<meta name="citation_issn" content="{{ page.scholar.issn | escape }}">
<meta name="citation_language" content="{{ page.scholar.language | escape }}">
<meta name="citation_abstract_html_url" content="{{ page.url | absolute_url | escape }}">
<meta name="citation_pdf_url" content="{{ page.paperurl | escape }}">
{% endif %}
